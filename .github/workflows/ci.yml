name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate
        run: bash scripts/validate.sh
