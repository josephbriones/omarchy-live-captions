name: Bug report
description: Report a reproducible Live Captions problem without sharing captured speech.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach private speech, usernames, full machine paths, or secrets. Report security issues privately.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: omarchy-version
    attributes:
      label: Omarchy version
    validations:
      required: true
  - type: input
    id: whisper-version
    attributes:
      label: whisper.cpp / whisper-server version
      description: The tested Arch baseline is 1.9.1, but doctor capability-probes the required flags and is authoritative.
    validations:
      required: true
  - type: input
    id: setpriv-version
    attributes:
      label: util-linux / setpriv version
      description: Paste the sanitized first line of `setpriv --version`; this command is mandatory in v0.2.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model name
      description: Give the model filename, not a private absolute path.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language setting
      description: Give the configured value, such as en, auto, or pt-BR. Do not include private paths.
      placeholder: en
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Demo (no audio)
        - Microphone
        - Desktop audio
        - Configuration or diagnostics
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps with private text replaced.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste doctor output only after checking it for sensitive values.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed captured speech, personal information, usernames, sensitive paths, and secrets.
          required: true
